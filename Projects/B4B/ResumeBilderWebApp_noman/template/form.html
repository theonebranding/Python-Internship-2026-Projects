<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume Builder</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans leading-normal tracking-normal">
    <div class="max-w-2xl mx-auto px-6 py-10 bg-white shadow-lg rounded-lg mt-10">
        <h1 class="text-3xl font-bold text-center text-gray-800 mb-6">PDF Resume Builder</h1>
        <form method="POST" enctype="multipart/form-data" class="space-y-4">
            
            {% for field in ["name", "email", "phone"] %}
            <div>
                <label for="input-{{ field }}" class="block text-gray-700 font-semibold capitalize">{{ field }}</label>
                <input type="text" name="{{ field }}" id="input-{{ field }}" required
                       class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 focus:ring-blue-500 focus:border-blue-500">
            </div>
            {% endfor %}

            <div>
                <label for="input-education" class="block text-gray-700 font-semibold">Education</label>
                <textarea name="education" id="input-education" rows="3" required
                       class="mt-1 block w-full border-gray-300 rounded-md shadow-sm p-2 focus:ring-blue-500 focus:border-blue-500"></textarea>
            </div>

            <div>
                <label for="input-skills" class="block text-gray-700 font-semibold">Skills</label>
                <textarea name="skills" id="input-skills" rows="3" required
                       class="mt-1 block w-full border-gray-300 rounded-md shadow-sm p-2 focus:ring-blue-500 focus:border-blue-500"></textarea>
            </div>

            <button type="submit"
                    class="w-full bg-blue-600 text-white font-bold py-2 px-4 rounded-lg hover:bg-blue-700 transition">
                Generate PDF Resume
            </button>
        </form>
    </div>
</body>
</html>
